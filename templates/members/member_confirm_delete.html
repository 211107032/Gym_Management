{% extends "base.html" %}
{% block title %}Confirm Delete Member{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow rounded-4 text-center p-4">
                <i class="bi bi-exclamation-triangle text-danger fs-1 mb-2"></i>
                <h4 class="fw-bold">Delete Member Account?</h4>
                <p class="text-muted">Are you sure you want to permanently delete <strong>{{ member.full_name }}</strong> (ID: {{ member.member_id }})? This action cannot be undone.</p>
                <form method="POST">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-2 mt-4">
                        <a href="{% url 'members:list' %}" class="btn btn-light border px-4">Cancel</a>
                        <button type="submit" class="btn btn-danger fw-bold px-4">Yes, Delete</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
