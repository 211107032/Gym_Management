{% extends "base.html" %}
{% block title %}Page Not Found (404){% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
        <h1 class="display-1 text-primary fw-bold">404</h1>

    </div>
</div>
{% endblock %}
