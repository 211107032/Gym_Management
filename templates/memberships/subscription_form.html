{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container py-3">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-header bg-white border-0 py-3">
                    <h5 class="fw-bold mb-0"><i class="bi bi-card-checklist text-primary me-2"></i>{{ title }}</h5>
                </div>
                <div class="card-body p-4">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="row g-3">
                            <div class="col-md-12">
                                <label class="form-label fw-semibold">Select Member</label>
                                {{ form.member }}
                            </div>
                            <div class="col-md-12">
                                <label class="form-label fw-semibold">Select Membership Plan</label>
                                {{ form.membership_plan }}
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Start Date</label>
                                {{ form.start_date }}
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Discount Amount (₹)</label>
                                {{ form.discount }}
                            </div>
                            <div class="col-md-12">
                                <label class="form-label fw-semibold">Initial Status</label>
                                {{ form.status }}
                            </div>
                        </div>
                        <div class="d-flex justify-content-between mt-4">
                            <a href="{% url 'memberships:subscription_list' %}" class="btn btn-light border">Cancel</a>
                            <button type="submit" class="btn btn-primary fw-bold px-4">Assign Subscription</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
