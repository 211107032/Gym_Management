{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container py-3">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-header bg-white border-0 py-3">
                    <h5 class="fw-bold mb-0"><i class="bi bi-card-checklist text-primary me-2"></i>{{ title }}</h5>
                </div>
                <div class="card-body p-4">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="row g-3">
                            <div class="col-md-12">
                                <label class="form-label fw-semibold">Plan Name</label>
                                {{ form.name }}
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Price (₹)</label>
                                {{ form.price }}
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Duration (Days)</label>
                                {{ form.duration_days }}
                            </div>
                            <div class="col-md-12">
                                <label class="form-label fw-semibold">Description</label>
                                {{ form.description }}
                            </div>
                            <div class="col-md-12">
                                <label class="form-label fw-semibold">Included Features (One per line)</label>
                                {{ form.features }}
                            </div>
                            <div class="col-md-12">
                                <div class="form-check">
                                    {{ form.is_active }}
                                    <label class="form-check-label fw-semibold">Active Plan</label>
                                </div>
                            </div>
                        </div>
                        <div class="d-flex justify-content-between mt-4">
                            <a href="{% url 'memberships:plan_list' %}" class="btn btn-light border">Cancel</a>
                            <button type="submit" class="btn btn-primary fw-bold px-4">Save Plan</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
