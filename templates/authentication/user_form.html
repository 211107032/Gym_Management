{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container py-3">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-header bg-white border-0 py-3">
                    <h5 class="fw-bold mb-0"><i class="bi bi-person-gear text-primary me-2"></i>{{ title }}</h5>
                </div>
                <div class="card-body p-4">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Username</label>
                                {{ form.username }}
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Role</label>
                                {{ form.role }}
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">First Name</label>
                                {{ form.first_name }}
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Last Name</label>
                                {{ form.last_name }}
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Email</label>
                                {{ form.email }}
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Phone</label>
                                {{ form.phone }}
                            </div>
                            <div class="col-md-12">
                                <label class="form-label fw-semibold">Password {% if target_user %}(Leave blank to keep current){% endif %}</label>
                                {{ form.password }}
                            </div>
                            <div class="col-md-12">
                                <div class="form-check">
                                    {{ form.is_active }}
                                    <label class="form-check-label fw-semibold">Is Active User Account</label>
                                </div>
                            </div>
                        </div>
                        <div class="d-flex justify-content-between mt-4">
                            <a href="{% url 'accounts:user_list' %}" class="btn btn-light border">Cancel</a>
                            <button type="submit" class="btn btn-primary fw-bold px-4">Save Account</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
