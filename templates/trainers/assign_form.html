{% extends "base.html" %}
{% block title %}Assign Trainer to Member{% endblock %}

{% block content %}
<div class="container py-3">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-header bg-white border-0 py-3">
                    <h5 class="fw-bold mb-0"><i class="bi bi-person-check text-primary me-2"></i>Assign Member to Personal Trainer</h5>
                </div>
                <div class="card-body p-4">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Select Trainer</label>
                            {{ form.trainer }}
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Select Member</label>
                            {{ form.member }}
                        </div>
                        <div class="d-flex justify-content-between mt-4">
                            <a href="{% url 'trainers:list' %}" class="btn btn-light border">Cancel</a>
                            <button type="submit" class="btn btn-primary fw-bold px-4">Assign Member</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
